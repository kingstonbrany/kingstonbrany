<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KingstonBrany — Home</title>
  <link rel="icon" type="image/jpg" href="./images/hacker.jpg">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navigation (hardcoded so it always shows, even if JS fails) -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="login.html" class="brand">KINGSTON<span>BRANY</span></a>
      <div class="nav-links">
        <a href="index.html" class="nav-link" data-page="index">Home</a>
        <a href="info.html" class="nav-link" data-page="info">Info</a>
        <a href="projects.html" class="nav-link" data-page="projects">Projects</a>
        <a href="more.html" class="nav-link" data-page="more">More</a>
        <a href="admin.html" class="nav-link admin-link" data-page="admin" hidden>Admin</a>
      </div>
    </div>
  </nav>

  <main class="page">
    <div class="auth-card">
      <h1 class="auth-title">Admin Login</h1>
      <p class="auth-sub">Welcome Back Kingston,lets get Cooking.</p>

      <div class="auth-tabs">
        
        
      </div>

      <form id="auth-form" class="auth-form">
        <div class="field">
          <label for="auth-email">Email</label>
          <input id="auth-email" type="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="auth-pass">Password</label>
          <input id="auth-pass" type="password" placeholder="At least 6 characters" required />
        </div>
        <button type="submit" class="btn btn-primary auth-submit" id="auth-submit">Sign In</button>
        <span class="auth-msg" id="auth-msg"></span>
      </form>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Kingston Brany. All rights reserved.</p>
  </footer>


  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
